plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Migrations and demo-data seeders are declarative fixture lists; the length
# budget doesn't apply.
Metrics/MethodLength:
  Exclude:
    - "db/migrate/**/*.rb"
    - "lib/tasks/**/*.rake"
    - "spec/support/demo_data.rb"
    - "spec/support/crz_import_payloads.rb"

# Demo-data seeders are declarative fixture lists; complexity metrics don't
# apply.
Metrics/AbcSize:
  Exclude:
    - "spec/support/demo_data.rb"
    - "lib/tasks/**/*.rake"
    - "spec/support/crz_import_payloads.rb"

# Spec example-group blocks and Rake task bodies are naturally long; exclude
# them from the limit.
Metrics/BlockLength:
  Exclude:
    - "spec/**/*.rb"
    - "lib/tasks/**/*.rake"

# Migration-shape specs describe a file path, not a class.
RSpec/DescribeClass:
  Exclude:
    - "spec/db/**/*.rb"

# The shared :db support context's argument is a lookup identifier, not a
# behavioural context description ("when/with/without" doesn't apply).
RSpec/ContextWording:
  Exclude:
    - "spec/support/**/*.rb"
