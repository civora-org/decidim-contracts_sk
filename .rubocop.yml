plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Migrations are declarative column lists; the length budget doesn't apply.
Metrics/MethodLength:
  Exclude:
    - "db/migrate/**/*.rb"

# Spec example-group blocks are naturally long; exclude them from the limit.
Metrics/BlockLength:
  Exclude:
    - "spec/**/*.rb"

# Migration-shape specs describe a file path, not a class.
RSpec/DescribeClass:
  Exclude:
    - "spec/db/**/*.rb"

# The shared :db support context's argument is a lookup identifier, not a
# behavioural context description ("when/with/without" doesn't apply).
RSpec/ContextWording:
  Exclude:
    - "spec/support/**/*.rb"
