# bundler-audit configuration (auto-loaded; --config defaults to this file).
#
# POLICY: ignores are exhaustive per-advisory (never per-gem), so any NEW
# advisory not listed here still fails CI and forces a fresh disposition.
#
# Pruned in civora-org/civora-platform#188 against both CI resolutions
# (DECIDIM_VERSION 0.31 and 0.32, fresh resolution, empty ignore list,
# 2026-10-13). The ten Rails 7.2 CVEs (CVE-2026-33168 ... -33176, -66066)
# are no longer reported on either line (0.31 resolves rails 7.2.4, 0.32
# resolves rails 8.1.4) and were removed. What is left is blocked upstream:
#   0.31 line: devise 4.9.4 (newest release, unpatched), shakapacker 8.3.0
#              (decidim-core pins ~> 8.3.0; fix needs >= 9.5.0), rubyzip 2.4.1;
#   0.32 line: rack-proxy 0.8.3 (decidim-core pins < 1.0), rubyzip 2.4.1.
# rubyzip is pinned `~> 2.0` by decidim-core on both lines (fix needs >= 3.4.0).
# This engine ships no JS bundles, never extracts zips and never proxies HTTP;
# the host app documents its own exposure in docs/ops/security-updates.md and
# mirrors the 0.32 entries in civora-host CI.
# REVISIT: drop the 0.31-only entries (devise, shakapacker) when the CI matrix
# drops the 0.31 line; the rest on the Decidim release that relaxes the pins.
---
ignore:
  # devise 4.9.4 (0.31 line)
  - CVE-2026-32700
  - CVE-2026-40295
  # shakapacker 8.3.0 (0.31 line)
  - GHSA-96qw-h329-v5rg
  # rubyzip 2.4.1 (decidim-core pins ~> 2.0; fix requires >= 3.4.0)
  - CVE-2026-85396
