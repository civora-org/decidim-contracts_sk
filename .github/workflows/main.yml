name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Job names keep the pre-matrix `Ruby 3.3.4` / `bundler-audit` form so the
    # branch-protection required checks still match the Decidim 0.31 legs.
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - decidim: '0.31'
            ruby: '3.3.4'
          - decidim: '0.32'
            ruby: '3.4.7'
    env:
      # Read by the Gemfile to pin the Decidim line (fresh resolution; the
      # engine does not commit Gemfile.lock).
      DECIDIM_VERSION: ${{ matrix.decidim }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake
        env:
          # Opt in to the DB-backed spec groups (in-memory SQLite, offline).
          CONTRACTS_SK_DB: "1"

  audit:
    runs-on: ubuntu-latest
    name: ${{ matrix.audit_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - decidim: '0.31'
            ruby: '3.3.4'
            audit_name: bundler-audit
          - decidim: '0.32'
            ruby: '3.4.7'
            audit_name: bundler-audit (Decidim 0.32)
    env:
      DECIDIM_VERSION: ${{ matrix.decidim }}
    # The engine intentionally does not commit Gemfile.lock (gem convention),
    # so this audits the current CI-time resolution.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install dependencies
        run: bundle install --jobs 4
      - name: Audit gems
        run: bundle exec bundler-audit check --update
